  - {id: aptitude-capable, label: Capable, constellation: contribution, cluster: aptitude, members: [primitive:sidekicks:competence-profiles:surprisingly-capable]}
  - {id: aptitude-exceptional, label: Exceptional, constellation: contribution, cluster: aptitude, members: [primitive:sidekicks:competence-profiles:frighteningly-effective, primitive:sidekicks:competence-profiles:terrifyingly-competent, primitive:sidekicks:competence-profiles:quietly-genius, primitive:sidekicks:fold-profiles:absolutely-unbreakable]}
  - {id: aptitude-carries-the-operation, label: Carries The Operation, constellation: contribution, cluster: aptitude, members: [primitive:sidekicks:competence-profiles:carrying-the-entire-operation, primitive:sidekicks:competence-profiles:the-only-adult-in-the-room]}

  # Breaking-point families

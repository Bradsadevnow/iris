  - {id: flaw-emotional-leverage, label: Emotionally Compromised, constellation: flaws, cluster: breaking_points, members: [primitive:sidekicks:fold-profiles:folds-only-for-love]}
  - {id: flaw-material-leverage, label: Materially Compromised, constellation: flaws, cluster: breaking_points, members: [primitive:sidekicks:fold-profiles:folds-when-payroll-stops]}
  - {id: flaw-petty-leverage, label: Petty Breaking Point, constellation: flaws, cluster: breaking_points, members: [primitive:sidekicks:fold-profiles:betrays-for-a-sandwich]}
  - {id: flaw-destructive-collapse, label: Destructive Collapse, constellation: flaws, cluster: breaking_points, members: [primitive:sidekicks:fold-profiles:never-folds-cleanly]}

deferred:
  plot_devices:
    preserve_losslessly: true
    next_pass: true
    groups: [petty_atrocities]
    future_clusters: [social_friction, recurring_gag, inciting_incident, escalation_trigger, character_reveal]
  settings:
    preserve_losslessly: true
    next_pass: true
    groups: [signifiers, skins, institutions]
    future_clusters: [visual_language, atmosphere, room_logic, object_logic, genre_frame, organization]
  holdings:
    preserve_losslessly: true
    next_pass: true
    groups: [macguffins, lairs, features]
    future_clusters: [artifacts, strongholds, access, resources, costs, liabilities]
  story:
    preserve_losslessly: true
    groups: [schemes, plot_shapes, plot_families, payoffs, reversals, story_functions,
             structural_complications, post_victory_reversal_states]
  generator:
    preserve_losslessly: true
    groups: [slots, selection_policy, tag]
